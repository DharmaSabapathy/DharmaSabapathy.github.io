# Publishes the repository to GitHub Pages exactly as it is — no build step.
#
# To use this workflow:
#   Repository -> Settings -> Pages -> Build and deployment -> Source:
#   "GitHub Actions"
#
# If you would rather not use Actions at all, delete this file and set
# Source to "Deploy from a branch" (main / root). Both work; the branch
# option is simpler, this one gives you a deployment log and lets you add
# link-checking or minification later.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
